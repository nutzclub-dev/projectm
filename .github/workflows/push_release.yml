name: push_release

on:
  push:
    tags:
      - "v*"
      - "*-release"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Wait On Windows Build
        uses: tomchv/wait-my-workflow@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: 'windows_build'
          ref: ${{ github.sha }}
          intervalSeconds: 60
          timeoutSeconds: 3600

      - name: Download Artifacts From Windows Build
        id: download-windows-artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: projectM-windows-*
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd ${{ github.workspace }}
          if ls projectM-windows-*.zip 1> /dev/null 2>&1; then
            sha256sum projectM-windows-*.zip > SHA256SUMS.txt
            cat SHA256SUMS.txt
          elif ls artifacts/projectM-windows-*.zip 1> /dev/null 2>&1; then
            cp artifacts/projectM-windows-*.zip .
            sha256sum projectM-windows-*.zip > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Set Release Tag Env
        shell: bash
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Display Ready Release Artifacts
        shell: bash
        run: |
          ls -la ${{ github.workspace }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            ${{ github.workspace }}/projectM-windows-x86.zip
            ${{ github.workspace }}/projectM-windows-x64.zip
            ${{ github.workspace }}/SHA256SUMS.txt
            ${{ github.workspace }}/projectm-*.tar.gz
            ${{ github.workspace }}/projectm-*.zip
